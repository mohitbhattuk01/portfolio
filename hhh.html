<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>To-Do List - Mohit Bhatt</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      background: #f0f0f0;
    }

    header {
      background: #333;
      color: white;
      text-align: center;
      padding: 30px 20px;
    }

    header h1 {
      font-size: 36px;
      margin-bottom: 5px;
    }

    nav {
      background: #444;
      padding: 10px;
      text-align: center;
    }

    nav a {
      color: white;
      text-decoration: none;
      margin: 0 15px;
      font-size: 16px;
    }

    nav a:hover {
      color: #ddd;
    }

    .container {
      max-width: 500px;
      margin: 30px auto;
      padding: 0 15px;
    }

    .todo-card {
      background: white;
      border: 1px solid #ccc;
      padding: 20px;
    }

    .todo-card h2 {
      color: #333;
      margin-bottom: 20px;
      text-align: center;
      font-size: 24px;
    }

    .input-section {
      display: flex;
      gap: 5px;
      margin-bottom: 20px;
    }

    .input-section input {
      flex: 1;
      padding: 10px;
      border: 1px solid #ccc;
      font-size: 14px;
    }

    .input-section button {
      padding: 10px 15px;
      background: #28a745;
      color: white;
      border: none;
      cursor: pointer;
      font-size: 14px;
    }

    .input-section button:hover {
      background: #218838;
    }

    .todo-list {
      list-style: none;
    }

    .todo-item {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 10px;
      background: #f9f9f9;
      border: 1px solid #eee;
      margin-bottom: 5px;
    }

    .todo-text {
      display: flex;
      align-items: center;
      gap: 10px;
      flex: 1;
    }

    .todo-text input[type="checkbox"] {
      width: 16px;
      height: 16px;
    }

    .todo-text span {
      font-size: 14px;
      color: #333;
    }

    .todo-text span.completed {
      text-decoration: line-through;
      color: #999;
    }

    .delete-btn {
      background: #dc3545;
      color: white;
      border: none;
      width: 25px;
      height: 25px;
      border-radius: 3px;
      font-size: 16px;
      cursor: pointer;
    }

    .delete-btn:hover {
      background: #c82333;
    }

    .stats {
      display: flex;
      justify-content: space-between;
      margin-top: 15px;
      padding: 10px;
      background: #f2f2f2;
      border: 1px solid #ddd;
    }

    .stats p {
      color: #333;
      font-size: 14px;
    }

    .clear-btn {
      background: #dc3545;
      color: white;
      border: none;
      padding: 5px 10px;
      cursor: pointer;
      font-size: 12px;
    }

    .clear-btn:hover {
      background: #c82333;
    }

    footer {
      background: #333;
      color: white;
      text-align: center;
      padding: 20px;
      margin-top: 30px;
    }

    .social-links a {
      color: white;
      text-decoration: none;
      margin: 0 10px;
      font-size: 14px;
    }
  </style>
</head>
<body>
  <header>
    <h1>To-Do List</h1>
    <p>by Mohit Bhatt</p>
  </header>

  <nav>
    <a href="index.html">Home</a>
    <a href="projects.html">Projects</a>
    <a href="resume.html">Resume</a>
    <a href="contact.html">Contact</a>
  </nav>

  <div class="container">
    <div class="todo-card">
      <h2>My Tasks</h2>

      <div class="input-section">
        <input type="text" id="taskInput" placeholder="Enter task...">
        <button id="micBtn" onclick="startSpeech()" style="background: #007bff; font-size: 16px;">🎤</button>
        <button onclick="addTask()">Add</button>
      </div>

      <ul class="todo-list" id="todoList">
        <!-- Tasks will appear here -->
      </ul>

      <div class="stats">
        <p>Total: <span id="totalTasks">0</span></p>
        <p>Done: <span id="completedTasks">0</span></p>
        <button class="clear-btn" onclick="clearAll()">Clear All</button>
      </div>
    </div>
  </div>

  <footer>
    <div class="social-links">
      <a href="https://www.instagram.com/mohitbhattuk01">Instagram</a> |
      <a href="https://www.facebook.com/mohitbhatt">Facebook</a> |
      <a href="https://www.youtube.com/@MohitBhattji-uk01">YouTube</a>
    </div>
    <p>© 2025 Mohit Bhatt</p>
  </footer>

  <script>
    let tasks = [];

    // Speech Recognition
    function startSpeech() {
      const micBtn = document.getElementById('micBtn');
      const taskInput = document.getElementById('taskInput');
      const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
      
      if (!SpeechRecognition) {
        alert("Your browser does not support Speech Recognition. Please use Google Chrome.");
        return;
      }

      const recognition = new SpeechRecognition();
      recognition.lang = 'en-US';
      
      recognition.onstart = function() {
        micBtn.style.background = '#dc3545';
        micBtn.textContent = '🛑';
        taskInput.placeholder = "Listening...";
      };

      recognition.onerror = function(event) {
        alert("Speech recognition error: " + event.error);
        resetMicBtn(micBtn, taskInput);
      };

      recognition.onend = function() {
        resetMicBtn(micBtn, taskInput);
      };

      recognition.onresult = function(event) {
        const transcript = event.results[0][0].transcript;
        taskInput.value = transcript;
        taskInput.focus();
      };

      recognition.start();
    }

    function resetMicBtn(micBtn, taskInput) {
      micBtn.style.background = '#007bff';
      micBtn.textContent = '🎤';
      taskInput.placeholder = "Enter task...";
    }

    function addTask() {
      const input = document.getElementById('taskInput');
      const text = input.value.trim();

      if (text === '') {
        alert('Please enter a task!');
        return;
      }

      tasks.push({
        id: Date.now(),
        text: text,
        completed: false
      });

      input.value = '';
      showTasks();
    }

    function toggleTask(id) {
      tasks = tasks.map(task => {
        if (task.id === id) {
          task.completed = !task.completed;
        }
        return task;
      });
      showTasks();
    }

    function deleteTask(id) {
      tasks = tasks.filter(task => task.id !== id);
      showTasks();
    }

    function clearAll() {
      if (confirm('Clear all tasks?')) {
        tasks = [];
        showTasks();
      }
    }

    function showTasks() {
      const list = document.getElementById('todoList');
      const total = document.getElementById('totalTasks');
      const done = document.getElementById('completedTasks');

      if (tasks.length === 0) {
        list.innerHTML = '<p style="text-align: center; color: #999; padding: 20px;">No tasks yet</p>';
      } else {
        list.innerHTML = tasks.map(task => `
          <li class="todo-item">
            <div class="todo-text">
              <input type="checkbox" ${task.completed ? 'checked' : ''} onchange="toggleTask(${task.id})">
              <span class="${task.completed ? 'completed' : ''}">${task.text}</span>
            </div>
            <button class="delete-btn" onclick="deleteTask(${task.id})">×</button>
          </li>
        `).join('');
      }

      total.textContent = tasks.length;
      done.textContent = tasks.filter(t => t.completed).length;
    }

    // Enter key support
    document.getElementById('taskInput').addEventListener('keypress', function(e) {
      if (e.key === 'Enter') {
        addTask();
      }
    });

    // Sample tasks
    window.onload = function() {
      tasks = [
        { id: 1, text: 'Complete portfolio', completed: false },
        { id: 2, text: 'Learn JavaScript', completed: true },
        { id: 3, text: 'Build weather app', completed: false }
      ];
      showTasks();
    };
  </script>
</body>
</html>
